name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependancies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: run test
        run: python manage.py test

      - name: Docker hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/helpdeskx:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/helpdeskx:latest .

      - name: push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/helpdeskx:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/helpdeskx:latest

      - name: deploy on EC2
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/helpdeskx:${{ github.sha }}
            docker stop helpdeskx || true
            docker rm helpdeskx || true
            docker run -d --name helpdeskx --restart unless-stopped -p 8088:8000 ${{ secrets.DOCKER_USERNAME }}/helpdeskx:${{ github.sha }}
            docker image prune -f
