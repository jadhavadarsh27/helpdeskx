version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdeskx
      POSTGRES_USER: helpdeskx
      POSTGRES_PASSWORD: helpdeskx
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: gunicorn helpdeskx.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=change-me-in-production
      - DJANGO_DEBUG=False
      - DATABASE_URL=postgres://helpdeskx:helpdeskx@db:5432/helpdeskx
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  media_data:
