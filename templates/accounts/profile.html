{% extends "base.html" %}
{% block topbar_title %}My Profile{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:520px;">
  <h5 class="section-title">Profile settings</h5>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-6 mb-3"><label class="form-label small">First name</label>{{ form.first_name }}</div>
      <div class="col-6 mb-3"><label class="form-label small">Last name</label>{{ form.last_name }}</div>
    </div>
    <div class="mb-3"><label class="form-label small">Email</label>{{ form.email }}</div>
    <div class="row">
      <div class="col-6 mb-3"><label class="form-label small">Department</label>{{ form.department }}</div>
      <div class="col-6 mb-3"><label class="form-label small">Phone</label>{{ form.phone }}</div>
    </div>
    <div class="mb-3"><label class="form-label small">Avatar</label>{{ form.avatar }}</div>
    <button type="submit" class="btn btn-primary">Save changes</button>
  </form>
</div>
{% endblock %}
